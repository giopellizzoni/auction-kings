name: infra
services:
  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"

  redis:
    image: redis:7-alpine
    container_name: infra-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --appendonly yes
      --requirepass \"$$(cat /run/secrets/redis_password)\""
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"

  localstack:
    image: localstack/localstack:latest
    container_name: infra-localstack
    restart: unless-stopped
    environment:
      SERVICES: dynamodb,sqs,sns,s3,secretsmanager,logs
      DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init/ready.d:/etc/localstack/init/ready.d:ro
    secrets:
      - postgres_password
      - redis_password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"dynamodb\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:4566:4566"

  moto:
    image: motoserver/moto:latest
    container_name: infra-moto
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/moto-api/"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5555:5555"

  moto-init:
    image: amazon/aws-cli:latest
    container_name: infra-moto-init
    restart: "no"
    depends_on:
      moto:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/bash", "/scripts/moto-init.sh"]
    volumes:
      - ./moto-init.sh:/scripts/moto-init.sh:ro
      - ./secrets:/secrets
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  localstack_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE}
  redis_password:
    file: ${REDIS_PASSWORD_FILE}

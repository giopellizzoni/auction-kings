# ──────────────────────────────────────────────────────────────
# Pipeline stage 2 of 5 — Build & push Docker images to GHCR.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)
#   2.  docker-publish.yml        → Build & push Docker images (this file)
#   3a. infra-staging.yml         → Terraform plan / apply  (manual)
#   3b. infra-staging-destroy.yml → Terraform destroy       (manual)
#   4.  deploy-staging.yml        → Deploy containers to ECS
#
# Triggers:
#   • CI passes on a PR targeting develop → auto-build & push
#   • Manual dispatch                     → ad-hoc builds
# ──────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  # Auto-trigger after CI passes on a PR targeting develop.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

  # Keep manual trigger for ad-hoc builds.
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build"
        required: true
        default: "both"
        type: choice
        options:
          - api
          - worker
          - both

env:
  # For workflow_run the SHA comes from the triggering workflow;
  # for workflow_dispatch it falls back to the current commit.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (inputs.image == 'api' || inputs.image == 'both'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-api:${{ env.COMMIT_SHA }}
            ghcr.io/${{ steps.repo.outputs.name }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build & Push Worker
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (inputs.image == 'worker' || inputs.image == 'both'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-worker:${{ env.COMMIT_SHA }}
            ghcr.io/${{ steps.repo.outputs.name }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

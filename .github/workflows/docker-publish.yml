# ──────────────────────────────────────────────────────────────
# Pipeline stage 2 of 5 — Build & push Docker images to GHCR.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)
#   2.  docker-publish.yml        → Build & push Docker images (this file)
#   3.  infra-staging.yml         → Terraform plan / apply
#   4.  deploy-staging.yml        → Deploy containers to ECS
#   5.  infra-staging-destroy.yml → Terraform destroy (manual only)
#
# Trigger: manual dispatch only. Nothing is published on merge — run this
# workflow (Actions → Publish Docker Images → Run workflow) and pick the branch
# to build. CI still builds the images on every PR/push without pushing them.
# Every stage after this one (infra, deploy) is manual as well.
# ──────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build"
        required: true
        default: "both"
        type: choice
        options:
          - api
          - worker
          - both

env:
  # The commit of the branch the workflow was dispatched on.
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    if: inputs.image == 'api' || inputs.image == 'both'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-api:${{ env.COMMIT_SHA }}
            ghcr.io/${{ steps.repo.outputs.name }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build & Push Worker
    runs-on: ubuntu-latest
    if: inputs.image == 'worker' || inputs.image == 'both'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-worker:${{ env.COMMIT_SHA }}
            ghcr.io/${{ steps.repo.outputs.name }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

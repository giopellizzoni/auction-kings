# ──────────────────────────────────────────────────────────────
# Pipeline stage 3a of 5 — Provision / update staging infrastructure.
#
# Logical order:
#   1.  ci.yml             → Build & test (.NET)
#   2.  docker-publish.yml → Build & push Docker images (PR → develop)
#   3.  infra-staging.yml  → Terraform plan / apply / destroy (this file) — MANUAL
#   4.  deploy-staging.yml → Deploy containers to ECS
#
# Triggers:
#   • Manual only (workflow_dispatch)
#   • Leave confirm_destroy blank  → plan, then auto-apply if changes detected
#   • Type 'destroy-staging'       → full environment teardown
#
# Prerequisites:
#   1. S3 backend configured in infra/terraform/staging/main.tf
#   2. AWS_STAGING_DEPLOY_ROLE_ARN secret set (OIDC role with Terraform perms)
# ──────────────────────────────────────────────────────────────

name: "Infrastructure – Staging"

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Leave blank for plan/apply. Type 'destroy-staging' to tear down the full environment."
        required: false
        default: ""

# Only one Terraform run at a time — never cancel a running apply.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform/staging
  TF_VAR_app_image: "ghcr.io/pellizzonicode/auction-kings-api:latest"
  TF_VAR_worker_image: "ghcr.io/pellizzonicode/auction-kings-worker:latest"

jobs:
  # ── Plan ──────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: inputs.confirm_destroy == ''
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # wrapper swallows -detailed-exitcode; disable so exit code 2 (changes) is preserved

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Apply - IAM permissions (bootstrap)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve -target=aws_iam_role_policy.github_actions_alb
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes detected — apply skipped."
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  # ── Apply (automatic when plan detects changes) ───────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has_changes == 'true' && inputs.confirm_destroy == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -no-color

  # ── Destroy (manual, requires confirmation) ───────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: inputs.confirm_destroy == 'destroy-staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan (destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -destroy -input=false -no-color

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -auto-approve

      - name: Confirm destruction
        run: |
          echo "::warning::Staging infrastructure destroyed."
          echo "  Region: ${{ env.AWS_REGION }}"
          echo "  Config: ${{ env.TF_WORKING_DIR }}"

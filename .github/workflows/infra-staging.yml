# ──────────────────────────────────────────────────────────────
# Pipeline stage 3a of 5 — Provision / update staging infrastructure.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)
#   2.  docker-publish.yml        → Build & push Docker images (PR → develop)
#   3a. infra-staging.yml         → Terraform plan / apply (this file) — MANUAL
#   3b. infra-staging-destroy.yml → Terraform destroy — MANUAL
#   4.  deploy-staging.yml        → Deploy containers to ECS
#
# Triggers:
#   • Manual only → plan or apply
#
# Prerequisites:
#   1. S3 backend configured in infra/terraform/staging/main.tf
#   2. AWS_STAGING_DEPLOY_ROLE_ARN secret set (OIDC role with Terraform perms)
# ──────────────────────────────────────────────────────────────

name: "Infrastructure \u2013 Staging"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

# Only one Terraform run at a time — never cancel a running apply.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform/staging
  TF_VAR_app_image: "ghcr.io/pellizzonicode/auction-kings-api:latest"
  TF_VAR_worker_image: "ghcr.io/pellizzonicode/auction-kings-worker:latest"

jobs:
  # ── Plan (manual "plan") ───────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: inputs.action == 'plan'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Apply - IAM permissions (bootstrap)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve -target=aws_iam_role_policy.github_actions_alb
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Apply (manual "apply") ────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: inputs.action == 'apply'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply - IAM permissions (bootstrap)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve -target=aws_iam_role_policy.github_actions_alb

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Print outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -no-color
# ──────────────────────────────────────────────────────────────
# Pipeline stage 3 of 5 — Provision / update staging infrastructure.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)
#   2.  docker-publish.yml        → Build & push Docker images
#   3.  infra-staging.yml         → Terraform plan / apply (this file)
#   4.  deploy-staging.yml        → Deploy containers to ECS
#   5.  infra-staging-destroy.yml → Terraform destroy (manual only)
#
# Triggers:
#   • Docker publish completes successfully → auto plan + apply
#   • Manual dispatch                       → ad-hoc runs
#
# Flow:
#   1. plan  — always runs; detects changes
#   2. apply — runs automatically if plan found changes
#
# Prerequisites:
#   1. S3 backend configured in infra/terraform/staging/main.tf
#   2. AWS_STAGING_DEPLOY_ROLE_ARN secret set (OIDC role with Terraform perms)
# ──────────────────────────────────────────────────────────────

name: "Infrastructure – Staging"

on:
  workflow_run:
    workflows: ["Publish Docker Images"]
    types: [completed]
    branches: [develop, main]

  workflow_dispatch:

# Only one Terraform run at a time — never cancel a running apply.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform/staging
  # Committed, non-secret variable values (terraform.tfvars is git-ignored, so CI previously had
  # no values for any required variable and every plan failed). Not prefixed TF_VAR_: Terraform
  # would read TF_VAR_<name> as the value of an input variable called <name>.
  TFVARS_FILE: terraform.staging.tfvars

jobs:
  # ── Plan ──────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # wrapper swallows -detailed-exitcode; disable so exit code 2 (changes) is preserved

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Apply - IAM permissions (bootstrap)
        # Self-apply all IAM policies attached to the deploy role so the role gains
        # its full permission set before the plan reads the rest of the state.
        # continue-on-error because the role may not yet have iam:PutRolePolicy on
        # first bootstrap (requires manual seed — see infra/terraform/staging/iam.tf).
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -input=false -auto-approve -var-file="$TFVARS_FILE" \
            -target=aws_iam_role.github_actions_deploy \
            -target=aws_iam_role_policy.github_actions_tf_state \
            -target=aws_iam_role_policy.github_actions_networking \
            -target=aws_iam_role_policy.github_actions_alb \
            -target=aws_iam_role_policy.github_actions_deploy \
            -target=aws_iam_role_policy.github_actions_rds \
            -target=aws_iam_role_policy.github_actions_elasticache \
            -target=aws_iam_role_policy.github_actions_sqs \
            -target=aws_iam_role_policy.github_actions_secrets \
            -target=aws_iam_role_policy.github_actions_logs \
            -target=aws_iam_role_policy.github_actions_iam
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -var-file="$TFVARS_FILE" -out=tfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes detected — apply skipped."
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  # ── Apply (automatic when plan detects changes) ───────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    # Approval gate: configure required reviewers on the "staging" environment
    # (Settings → Environments). The job's OIDC subject becomes
    # repo:OWNER/REPO:environment:staging, which must be listed in github.oidc_subjects.
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -no-color


name: Docker

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/services/AuctionKings.API/Dockerfile
          push: true
          tags: |
            ghcr.io/pellizzonicode/auction-kings:sha-${{ github.sha }}
            ghcr.io/pellizzonicode/auction-kings:latest

name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test test/AuctionKings.UnitTests/ \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/unit \
            --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Architecture Tests
        run: |
          dotnet test test/AuctionKings.ArchitectureTests/ \
            --no-build \
            --configuration Release \
            --results-directory ./coverage/arch \
            --logger "trx;LogFileName=arch-tests.trx"

      - name: Run Integration Tests
        timeout-minutes: 15
        run: |
          dotnet test test/AuctionKings.IntegrationTests/ \
            --no-build \
            --configuration Release \
            --results-directory ./coverage/integration \
            --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: ./coverage/**/*.xml

      - name: Upload TRX results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trx-results
          path: ./coverage/**/*.trx

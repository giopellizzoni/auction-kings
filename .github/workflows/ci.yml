# ──────────────────────────────────────────────────────────────
# Pipeline stage 1 of 5 — Build & test the .NET solution.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)  (this file)
#   2.  docker-publish.yml        → Build & push Docker images
#   3.  infra-staging.yml         → Terraform plan / apply
#   4.  deploy-staging.yml        → Deploy containers to ECS
#   5.  infra-staging-destroy.yml → Teardown (manual only)
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test test/AuctionKings.UnitTests/ \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/unit \
            --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Architecture Tests
        run: |
          dotnet test test/AuctionKings.ArchitectureTests/ \
            --no-build \
            --configuration Release \
            --results-directory ./coverage/arch \
            --logger "trx;LogFileName=arch-tests.trx"

      - name: Run Integration Tests
        timeout-minutes: 15
        run: |
          dotnet test test/AuctionKings.IntegrationTests/ \
            --no-build \
            --configuration Release \
            --results-directory ./coverage/integration \
            --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-results
          path: ./coverage/**/*.xml

      - name: Upload TRX results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trx-results
          path: ./coverage/**/*.trx

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build only (nothing is pushed): the images are built from the same Dockerfiles docker-publish.yml uses.
    # A missing file in the build context (for example .editorconfig) otherwise only fails after the merge.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          cache-from: type=gha

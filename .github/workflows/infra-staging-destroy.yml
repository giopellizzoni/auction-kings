# ──────────────────────────────────────────────────────────────
# Terraform Destroy — tears down the staging infrastructure.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)
#   2.  docker-publish.yml        → Build & push Docker images
#   3.  infra-staging.yml         → Terraform plan / apply
#   4.  infra-staging-destroy.yml → Terraform destroy (this file) — MANUAL ONLY
#
# Trigger: manual dispatch only (workflow_dispatch).
#
# Prerequisites:
#   1. S3 backend configured in infra/terraform/staging/main.tf
#   2. AWS_STAGING_DEPLOY_ROLE_ARN secret set (OIDC role with Terraform perms)
# ──────────────────────────────────────────────────────────────

name: "Infrastructure – Staging Destroy"

on:
  workflow_dispatch:

# Never run two destroys in parallel.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform/staging

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan (destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -destroy -input=false -no-color

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -auto-approve

      - name: Confirm destruction
        run: |
          echo "::warning::Staging infrastructure destroyed."
          echo "  Region: ${{ env.AWS_REGION }}"
          echo "  Config: ${{ env.TF_WORKING_DIR }}"

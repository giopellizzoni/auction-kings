# ──────────────────────────────────────────────────────────────
# Pipeline stage 4 of 4 — Deploy containers to ECS Staging.
#
# Logical order:
#   1. ci.yml              → Build & test (.NET)
#   2. docker-publish.yml  → Build & push Docker images (after CI)
#   3. infra-staging.yml   → Terraform plan / apply
#   4. deploy-staging.yml  → Deploy containers to ECS (this file)
#
# This workflow assumes infrastructure has already been provisioned
# by infra-staging.yml (Terraform). It only updates ECS task
# definitions with new container images.
# ──────────────────────────────────────────────────────────────

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Publish Docker Images"]
    types:
      - completed
    branches:
      - develop
      - main

  # Allow manual trigger with a specific image tag
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. abc1234). Defaults to latest commit SHA on main."
        required: false
        default: ""
      action:
        description: "Action to perform: 'deploy' (default) or 'destroy' (tears down the staging environment)."
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      confirm_destroy:
        description: "Type 'yes' to confirm environment destruction. Required when action is 'destroy'."
        required: false
        default: ""

jobs:
  # ── Deploy API ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API to ECS Staging
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')

    permissions:
      id-token: write # Required for OIDC → AssumeRoleWithWebIdentity
      contents: read

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: auction-kings-staging
      ECS_SERVICE: auction-kings-staging-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=ghcr.io/${{ steps.repo.outputs.name }}-api:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition auction-kings-staging-api \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Print staging URL
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names auction-kings-staging \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          echo "Staging URL: http://${ALB_DNS}"
          echo "Health check: http://${ALB_DNS}/health/ready"

  # ── Deploy Worker ───────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker to ECS Staging
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: auction-kings-staging
      ECS_SERVICE: auction-kings-staging-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=ghcr.io/${{ steps.repo.outputs.name }}-worker:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition auction-kings-staging-worker \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: worker
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  # ── Destroy (ECS services only) ─────────────────────────────
  # This tears down ECS services and the cluster.
  # For FULL infrastructure destruction (VPC, RDS, ElastiCache, etc.),
  # use the "Infrastructure – Staging" workflow with action = destroy.
  destroy:
    name: Destroy Staging Environment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'yes'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: auction-kings-staging

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale API service to zero
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service auction-kings-staging-api \
            --desired-count 0

      - name: Scale Worker service to zero
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service auction-kings-staging-worker \
            --desired-count 0

      - name: Wait for services to drain
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services auction-kings-staging-api auction-kings-staging-worker

      - name: Delete API service
        run: |
          aws ecs delete-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service auction-kings-staging-api \
            --force
          echo "ECS service 'auction-kings-staging-api' deleted."

      - name: Delete Worker service
        run: |
          aws ecs delete-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service auction-kings-staging-worker \
            --force
          echo "ECS service 'auction-kings-staging-worker' deleted."

      - name: Delete ECS cluster
        run: |
          aws ecs delete-cluster \
            --cluster ${{ env.ECS_CLUSTER }}
          echo "ECS cluster '${{ env.ECS_CLUSTER }}' deleted."

      - name: Confirm destruction
        run: |
          echo "Staging environment destroyed:"
          echo "  Cluster : ${{ env.ECS_CLUSTER }}"
          echo "  Services: auction-kings-staging-api, auction-kings-staging-worker"
          echo "  Region  : ${{ env.AWS_REGION }}"

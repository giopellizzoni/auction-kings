# ──────────────────────────────────────────────────────────────
# Pipeline stage 4 of 5 — Deploy containers to ECS Staging.
#
# Logical order:
#   1.  ci.yml                    → Build & test (.NET)
#   2.  docker-publish.yml        → Build & push Docker images
#   3.  infra-staging.yml         → Terraform plan / apply
#   4.  deploy-staging.yml        → Deploy containers to ECS (this file)
#   5.  infra-staging-destroy.yml → Teardown (manual only)
#
# Trigger: manual dispatch only.
#
# This workflow assumes infrastructure has already been provisioned
# by infra-staging.yml (Terraform) and the image tag was pushed by
# docker-publish.yml. It only updates ECS task definitions with new
# container images. To tear staging down, use infra-staging-destroy.yml.
# ──────────────────────────────────────────────────────────────

name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (a full commit SHA published by docker-publish.yml, or latest). Defaults to the SHA of the branch you run this on."
        required: false
        default: ""

jobs:
  # ── Deploy API ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API to ECS Staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC → AssumeRoleWithWebIdentity
      contents: read

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: auction-kings-staging
      ECS_SERVICE: auction-kings-staging-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=ghcr.io/${{ steps.repo.outputs.name }}-api:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition auction-kings-staging-api \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Print staging URL
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names auction-kings-staging \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          echo "Staging URL: http://${ALB_DNS}"
          echo "Health check: http://${ALB_DNS}/health/ready"

  # ── Deploy Worker ───────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker to ECS Staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: auction-kings-staging
      ECS_SERVICE: auction-kings-staging-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=ghcr.io/${{ steps.repo.outputs.name }}-worker:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition auction-kings-staging-worker \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: worker
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

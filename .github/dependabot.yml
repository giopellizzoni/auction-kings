# Dependabot: weekly dependency updates and security alerts (replaces the Snyk PR check).
# NuGet versions are centralised in Directory.Packages.props, which Dependabot updates directly.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors and security fixes stay separate.
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/staging
    schedule:
      interval: weekly
